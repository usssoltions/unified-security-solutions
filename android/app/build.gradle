plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'co.za.unifiedsecuritysolutions.ussguard'
    compileSdk 34

    defaultConfig {
        applicationId "co.za.unifiedsecuritysolutions.ussguard"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4.0"
    }

    // Release signing: place keystore.properties (next to this file) with
    // storeFile=, storePassword=, keyAlias=, keyPassword= to sign release with
    // the PRODUCTION keystore. Without it, release is signed with the debug
    // key so the release APK still installs on SPARE TEST DEVICES. Before any
    // client-device rollout, ALWAYS confirm the release APK's certificate
    // matches the installed app (apksigner verify --print-certs).
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file("keystore.properties")
    def hasProductionKeystore = false
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
        hasProductionKeystore = keystoreProps.getProperty("storeFile") != null
    }

    signingConfigs {
        release {
            if (hasProductionKeystore) {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            if (hasProductionKeystore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.onesignal:OneSignal:5.6.1'
    // USS VOICE LINK (pilot): WebRTC engine for native individual calls
    implementation 'org.webrtc:google-webrtc:1.0.32006'
}