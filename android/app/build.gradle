plugins {
    id 'com.android.application'
}

android {
    namespace 'co.za.unifiedsecuritysolutions.ussguard'
    compileSdk 34

    defaultConfig {
        applicationId "co.za.unifiedsecuritysolutions.ussguard"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            // Replace with your keystore path and credentials
            // storeFile file("ussguard.jks")
            // storePassword "your-keystore-password"
            // keyAlias "ussguard"
            // keyPassword "your-key-password"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            // Uncomment when keystore is configured:
            // signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
}