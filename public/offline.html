<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SecureGuard — Offline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card { text-align: center; max-width: 360px; }
  .shield {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #38bdf8, #2563eb);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
    box-shadow: 0 20px 40px -10px rgba(14, 165, 233, 0.4);
  }
  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
  p { font-size: 0.9rem; color: #94a3b8; line-height: 1.5; margin-bottom: 1.5rem; }
  button {
    background: #0ea5e9; color: white; border: none; border-radius: 12px;
    padding: 0.75rem 1.5rem; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: #0284c7; }
</style>
</head>
<body>
<div class="card">
  <div class="shield">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
  </div>
  <h1>You're Offline</h1>
  <p>SecureGuard can't reach the server right now. Check your internet connection and try again.</p>
  <button onclick="window.location.reload()">Retry Connection</button>
</div>
</body>
</html>
